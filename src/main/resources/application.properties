spring.application.name=poo-spring-ai
spring.config.import=optional:file:.env[.properties]
spring.ai.google.genai.api-key=${GEMINI_API_KEY:nao-configurada}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.datasource.url=jdbc:h2:file:./data/forca
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
